name: Update publications from CV

on:
  push:
    paths:
      - 'cv.pdf'        # triggers only when the CV is updated
  workflow_dispatch:    # also allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-pubs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pdfplumber

      - name: Regenerate publications section in index.html
        run: python update_pubs.py --cv cv.pdf --html index.html

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --cached figures/ --ignore-unmatch
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update publications from cv.pdf [skip ci]"
          git push
