name: Update publications from CV
on:
  push:
    paths:
      - 'cv.pdf'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-pubs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install pdfplumber pypdf pdf2image Pillow requests duckduckgo-search
      - name: Install poppler (needed by pdf2image)
        run: sudo apt-get install -y poppler-utils
      - name: One-shot fix of a mis-assigned override
        # DELETE THIS STEP after it has run once.
        # The old pub_10.png was the image-goal paper's figure, not the
        # Compressing paper's. Move it to the right slug and drop both stale
        # thumbnails so one is rebuilt from the override and the other refetched.
        run: |
          OLD=figures/overrides/pub_compressing-observation-history-into.png
          NEW=figures/overrides/pub_what-does-really-matter-in-image-goal.png
          if [ -f "$OLD" ]; then
            git mv "$OLD" "$NEW"
            rm -f figures/pub_compressing-observation-history-into.jpg
            rm -f figures/pub_what-does-really-matter-in-image-goal.jpg
            echo "moved override to $NEW"
          else
            echo "already fixed, nothing to do"
          fi
      - name: Regenerate publications section in index.html
        # --min-pubs is a sanity floor: if a CV restyle breaks the parser we
        # want the action to fail loudly rather than publish a mangled page.
        run: python update_pubs.py --cv cv.pdf --html index.html --verbose --min-pubs 30
      - name: Fetch figures for publications (2016+)
        # No --force: filenames are stable now, so existing thumbnails and
        # overrides are reused and only new papers are fetched. --prune drops
        # thumbnails whose paper has left the CV.
        run: python fetch_figures.py --cv cv.pdf --out figures --prune
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html figures/
          git diff --cached --quiet || git commit -m "chore: update publications and figures from cv.pdf [skip ci]"
          git push
